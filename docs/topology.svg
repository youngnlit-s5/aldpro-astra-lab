<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="780" height="420" fill="#f7f9fc"/>
  <text x="390" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F3864">aldpro-astra-lab — ALD Pro 3.0.0 on Astra Linux Special Edition 1.7.7</text>
  <text x="390" y="52" text-anchor="middle" font-size="12" fill="#666">libvirt/KVM · isolated NAT network "aldlab" · 192.168.150.0/24 · domain lab.local</text>

  <!-- host -->
  <rect x="60" y="72" width="660" height="30" rx="6" fill="#eef2f7" stroke="#99a" stroke-width="1"/>
  <text x="390" y="92" text-anchor="middle" font-size="11" fill="#556">KVM host (homemachine) · virbr-ald 192.168.150.1 (NAT gateway)</text>

