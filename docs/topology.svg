  <line x1="400" y1="260" x2="400" y2="298" stroke="#1F3864" stroke-width="2" marker-end="url(#a)"/>
  <text x="415" y="282" font-size="10" fill="#777">domain join · Kerberos · DNS = 192.168.150.10</text>

  <text x="40" y="414" font-size="11" fill="#999">Portal (web console): https://ald-dc.lab.local · developers / helpdesk OUs · sudo rules per group.</text>
