  <rect x="290" y="120" width="220" height="140" rx="8" fill="#e8f0fe" stroke="#1F3864" stroke-width="2"/>
  <text x="400" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#1F3864">ald-dc</text>
  <text x="400" y="164" text-anchor="middle" font-size="11" fill="#444">Astra Linux SE 1.7.7 · Fly-ssh</text>
  <text x="400" y="181" text-anchor="middle" font-size="11" fill="#444">security level: Смоленск (max)</text>
  <text x="400" y="198" text-anchor="middle" font-size="11" fill="#444">FreeIPA DS · KDC · BIND9 · Portal</text>
  <text x="400" y="215" text-anchor="middle" font-size="11" fill="#444">aldpro-mp / gc / syncer</text>
  <text x="400" y="238" text-anchor="middle" font-size="10" fill="#777">192.168.150.10 · ald-dc.lab.local</text>

  <!-- client -->
  <rect x="290" y="300" width="220" height="100" rx="8" fill="#ffffff" stroke="#2E7D32" stroke-width="2"/>
  <text x="400" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D32">ald-cl1</text>
