# ald-dc unattended install preseed
# Based on the official example in Administrator_Docs_3.0.0_v2.pdf, section
# "Roles and site services -> Automation -> Boot profiles -> Preseed" (p.132-135),
# adapted for a static-IP domain controller install per Part 1, 2.1.1.

# Base system comes off the attached Astra ISO (sda, ide-cd) -- network
# debootstrap against repository-base failed (debootstrap exit 1); the CD
# path is the officially documented offline-install alternative and doesn't
# depend on the mirror being reachable this early in the install.
d-i apt-setup/cdrom/set-first boolean true
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-double boolean false
d-i apt-setup/cdrom/set-failed boolean false

d-i debian-installer/locale string en_US
d-i debian-installer/locale select en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i debian-installer/keymap string us
d-i console-tools/archs select at
d-i console-keymaps-at/keymap select us
d-i keyboard-configuration/toggle select Alt+Shift
d-i keyboard-configuration/layoutcode string us
d-i keyboard-configuration/xkb-keymap select us
d-i languagechooser/language-name-fb select English
d-i countrychooser/country-name select United States

d-i netcfg/choose_interface select auto
d-i netcfg/disable_autoconfig boolean true
d-i netcfg/get_ipaddress string 192.168.150.10
d-i netcfg/get_netmask string 255.255.255.0
d-i netcfg/get_gateway string 192.168.150.1
d-i netcfg/get_nameservers string 77.88.8.8
d-i netcfg/confirm_static boolean true
d-i netcfg/get_hostname string ald-dc
d-i netcfg/get_domain string lab.local
d-i netcfg/hostname string ald-dc

d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/services-select none

d-i clock-setup/utc boolean true
d-i time/zone string Europe/Moscow
# Deviation from the doc example (which sets this false): Kerberos in ALD Pro
# needs clock skew under 5 minutes across all hosts, so NTP is enabled during
# install rather than left for later.
d-i clock-setup/ntp boolean true
d-i clock-setup/ntp-server string ru.pool.ntp.org

d-i partman-base       partman/default_filesystem          string   ext4
d-i partman-auto/init_automatically_partition \
        select Авто - использовать весь диск
d-i partman-auto/method string regular
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-lvm/confirm boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman-auto-crypto/erase_disks       boolean true
d-i partman-basicfilesystems/no_swap boolean        false
d-i partman-target/mount_failed boolean true
d-i partman-partitioning/unknown_label boolean      true
d-i partman-auto/purge_lvm_from_device string       true
d-i partman-lvm/vgdelete_confirm boolean            true
d-i partman/confirm_write_new_label        string   true
d-i partman-lvm/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i anna/no_kernel_modules boolean true
d-i base-installer/kernel/image string linux-image-generic

d-i passwd/make-user boolean true
d-i passwd/user-fullname string labadmin
d-i passwd/username string labadmin
d-i passwd/user-password password CHANGE_ME_SRV
d-i passwd/user-password-again password CHANGE_ME_SRV
d-i debian-installer/allow_unauthenticated string true
d-i astra-license/license boolean true
d-i cdrom-detect/load_media boolean false
d-i cdrom-detect/manual_config boolean false
d-i cdrom-detect/retry boolean false

# Server profile: SSH only, no desktop (matches production DC practice --
# avoids the NetworkManager-vs-static-/etc/network/interfaces conflict the
# docs warn about in 2.1.1.2).
tasksel tasksel/first multiselect Fly-ssh
tasksel tasksel/astra-feat-setup multiselect
d-i astra-additional-setup/os-check select Base security level Orel
d-i astra-additional-setup/additional-settings-orel multiselect
astra-additional-setup astra-additional-setup/automatic-network-disable multiselect
d-i astra-additional-setup/automatic-network-disable multiselect
d-i desktop-tablet-mode-switch/tablet-mode multiselect
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/password password CHANGE_ME_GRUB
d-i grub-installer/password-again password CHANGE_ME_GRUB

d-i finish-install/reboot_in_progress note

# wget is not present in a CD-only base install (no network debootstrap), so
# late_command runs the postinstall steps inline instead of fetching a script.
d-i preseed/late_command string \
   in-target bash -c 'echo root:CHANGE_ME_ROOT | chpasswd'; \
   in-target bash -c "sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config"; \
   in-target bash -c "sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config"; \
   in-target systemctl enable ssh; \
   in-target bash -c 'printf "127.0.0.1 localhost.localdomain localhost\n192.168.150.10 ald-dc.lab.local ald-dc\n" > /etc/hosts'; \
   in-target systemctl mask NetworkManager; \
   in-target bash -c "sed -i 's/^deb-src/#deb-src/g' /etc/apt/sources.list"; \
   in-target bash -c 'printf "auto lo\niface lo inet loopback\n\nauto eth0\niface eth0 inet static\n   address 192.168.150.10\n   netmask 255.255.255.0\n   gateway 192.168.150.1\n" > /etc/network/interfaces'; \
   in-target bash -c 'printf "ald-dc.lab.local\n" > /etc/hostname'
